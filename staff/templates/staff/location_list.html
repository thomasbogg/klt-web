{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations | Staff</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <link rel="stylesheet" href="{% static 'staff/booking_detail.css' %}">
    <link rel="stylesheet" href="{% static 'staff/home.css' %}">
</head>
<body>
    <div class="staff-page">
        {% include 'staff/_nav.html' %}

        <header class="staff-header">
            <h1 class="staff-page-title">Locations</h1>
        </header>

        <div class="staff-home-filters">
            <a href="{% url 'staff:location_create' %}" class="staff-button">+ Add new location</a>
        </div>

        <div class="staff-home-reservations">
            <table class="staff-reservations-table">
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>City</th>
                        <th>Properties</th>
                    </tr>
                </thead>
                <tbody>
                    {% for location in locations %}
                    <tr>
                        <td><a href="{% url 'staff:location_detail' pk=location.pk %}">{{ location }}</a></td>
                        <td>{{ location.city }}</td>
                        <td>{{ location.property_count }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="staff-empty">No locations yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
