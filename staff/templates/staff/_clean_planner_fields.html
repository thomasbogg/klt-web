<div class="staff-clean-planner">
    <label class="staff-field">{{ label|default:"Clean" }} date
        <input
            type="text" name="{{ field_prefix }}date" class="staff-input staff-date-input" autocomplete="off"
            value="{{ task.date|date:'Y-m-d' }}"
            data-min-date="{{ min_date|date:'Y-m-d' }}"
            data-max-date="{{ max_date|date:'Y-m-d' }}"
            {% if not standalone %}form="booking-detail-form"{% endif %}
        >
    </label>
    <fieldset class="staff-popup-section">
        <legend>{{ label|default:"Cleaning" }} staff</legend>
        {% for user in assignable_users %}
        <label class="staff-checkbox-label">
            <input
                type="checkbox" name="{{ field_prefix }}assigned_to" value="{{ user.pk }}"
                {% if not standalone %}form="booking-detail-form"{% endif %}
                {% if user.pk in assigned_ids %}checked{% endif %}
            >
            {{ user.username }}
        </label>
        {% empty %}
        <p class="staff-empty">No cleaning staff roles set up yet.</p>
        {% endfor %}
    </fieldset>
    <label class="staff-field">Team
        <select
            name="{{ field_prefix }}team" class="staff-input"
            {% if not standalone %}form="booking-detail-form"{% endif %}
        >
            {% for value, display in task.TEAM_CHOICES %}
            <option value="{{ value }}" {% if task.team == value %}selected{% endif %}>{{ display }}</option>
            {% endfor %}
        </select>
    </label>
    {% if task.task_type == 'freshen' and task.status == 'pending' %}
        {% if standalone %}
        <button type="button" id="clean-task-dismiss-btn" data-task-id="{{ task.pk }}" class="staff-button staff-button-danger">Delete Freshen clean</button>
        {% else %}
        <form method="post" data-confirm-message="Dismiss this Freshen clean? You can undo this from here afterwards.">
            {% csrf_token %}
            <input type="hidden" name="action" value="dismiss_freshen">
            <button type="submit" class="staff-button staff-button-danger">Delete Freshen clean</button>
        </form>
        {% endif %}
    {% endif %}
</div>
