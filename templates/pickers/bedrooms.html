<div class="container picker visible bedrooms {{ name }}">
    <input type="text" class="readonly" name="{{ name }}" id="{{ name }}" autocomplete="off" readonly>
    <div class="container picker bedrooms {{ name }} hidden" hidden>
        <div class="options">
            {% for bedroom in bedrooms %}
                <button type="button" class="option">{{ bedroom }} Bedroom{{ bedroom|pluralize }}</button>
            {% endfor %}
        </div>
    </div>
</div>
