<div class="container picker visible group {{ name }}">
    <input type="text" class="readonly" name="{{ name }}" id="{{ name }}" autocomplete="off" readonly>
    <div class="container picker group {{ name }} hidden" hidden>
        
        {% for group_item, default_num, min_num, max_num in groups %}
            <div class="row">
                <label>{{ group_item|capfirst }}</label>

                <div class ="counter">
                    <button type="button" id="{{ group_item }}" class="decrement">-</button>
                    <p class="count" id="{{ group_item }}" min="{{ min_num }}" max="{{ max_num }}">
                        {{ default_num }}
                    </p>
                    <button type="button" id="{{ group_item }}" class="increment">+</button>
                </div>
            </div>
            {% endfor %}
    </div>
</div>
