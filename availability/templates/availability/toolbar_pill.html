<form class="toolbar availability pill" method="get" action="/availability/search/">
    <div class="container toolbar availability pill">
    
        <div class="datepickers">
            {% include 'pickers/dates.html' with name=datepicker_start_name max_date=datepicker_max_date %}
            {% include 'pickers/dates.html' with name=datepicker_end_name max_date=datepicker_max_date %}
        </div>
    
        <div class="grouppicker-and-submit">
            {% include 'pickers/groups.html' with name=grouppicker_name groups=grouppicker_groups %}
            <button class="submit" type="submit">GO</button>
        </div>

    </div>
</form>
